# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml.

title: REDagent
url: https://edgemodders.github.io
baseurl: /REDagent
repo: https://github.com/Edgemodders/REDagent

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Guide
    url: /guide.html
  - title: Design
    url: /design.html
  - title: Changelog
    url: /changelog.html
  - title: REDnode
    url: https://edgemodders.github.io/REDnode/
