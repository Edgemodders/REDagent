# Builds the REDagent player zip: the package laid out like the game folder, with no
# node_modules (tools/release-zip.mjs). The Claude Agent SDK is not in it: REDagent fetches
# it on the player's PC at first start. The same zip goes to Nexus Mods and to the GitHub release.
#
#   Run workflow (Actions tab)                  builds the zip and keeps it as the run's artifact
#   Run workflow, "Make a release" ticked       also tags the commit v<version> and makes the
#                                               GitHub release with the zip; stops first if that
#                                               tag exists (raise the version in redagent/package.json
#                                               and redagent/rednode-app.json) or docs/changelog.md
#                                               has no section for it (tools/notes.mjs)
#   ... and "Update Nexus Mods" ticked          also, after the GitHub release, uploads the zip to
#                                               the Nexus page as the main file's new version (the
#                                               old one archived), adds its changelog and pushes
#                                               nexus/description.bbcode (tools/nexus/nexus.mjs,
#                                               the organization's NEXUS_KEY secret). It checks the
#                                               page first and stops before building if the
#                                               description changed on Nexus since the last pull
#                                               (node tools/nexus/nexus.mjs pull, commit, run again).
#                                               If the upload fails after the GitHub release, run
#                                               tools/nexus/nexus.mjs release on the dev PC with the
#                                               release's zip: it skips what is already done.
#
# The briefing is copied from REDnode's guide at the tag of the REDnode REDagent needs: the
# version in redagent/rednode-app.json's "requires" (">=0.32.1" reads REDnode's v0.32.1).
#
# Release gate: make a release only after every in-game test of the builds since the last
# release has passed (docs/design.md). Untested or failed means no release.
name: Release zip

on:
  workflow_dispatch:
    inputs:
      release:
        description: Make a release (tags this commit v<version>). Only after every in-game test has passed
        type: boolean
        default: false
      nexus:
        description: Update Nexus Mods (with Make a release) - upload the zip, its changelog and the page's description
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  zip:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags: the Nexus check compares with the previous release's description

      - name: The REDnode REDagent needs
        id: rednode
        run: |
          $needs = (Get-Content redagent/rednode-app.json -Raw | ConvertFrom-Json).requires.rednode
          if ($needs -notmatch '^>=\s*(\d+\.\d+\.\d+)$') {
            Write-Output "::error::redagent/rednode-app.json's requires.rednode should be '>=x.y.z', not '$needs'"
            exit 1
          }
          "tag=v$($Matches[1])" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: Edgemodders/REDnode
          ref: ${{ steps.rednode.outputs.tag }}
          path: rednode-src
          sparse-checkout: docs/overlay-apps.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The version is not released yet
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content redagent/package.json -Raw | ConvertFrom-Json).version
          gh api "repos/${{ github.repository }}/git/ref/tags/v$version" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::v$version is already released. Raise the version in redagent/package.json and redagent/rednode-app.json."
            exit 1
          }
          $global:LASTEXITCODE = 0

      - name: Release notes from docs/changelog.md
        if: inputs.release
        run: |
          node tools/notes.mjs --out "$env:RUNNER_TEMP/notes.md"
          node tools/notes.mjs --nexus --out "$env:RUNNER_TEMP/nexus-notes.txt"

      - name: Nexus Mods can take this release
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          $version = (Get-Content redagent/package.json -Raw | ConvertFrom-Json).version
          node tools/nexus/nexus.mjs check --version $version

      - name: Build the zip
        run: node tools/release-zip.mjs rednode-src

      - uses: actions/upload-artifact@v4
        with:
          name: REDagent-zip
          path: release/REDagent-*.zip
          if-no-files-found: error

      - name: GitHub release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content redagent/package.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" "release/REDagent-$version.zip" --target $env:GITHUB_SHA --title "REDagent $version" --notes-file "$env:RUNNER_TEMP/notes.md"

      - name: Nexus Mods
        if: inputs.release && inputs.nexus
        env:
          NEXUS_KEY: ${{ secrets.NEXUS_KEY }}
        run: |
          $version = (Get-Content redagent/package.json -Raw | ConvertFrom-Json).version
          node tools/nexus/nexus.mjs release --version $version --zip "release/REDagent-$version.zip" --notes "$env:RUNNER_TEMP/nexus-notes.txt"
